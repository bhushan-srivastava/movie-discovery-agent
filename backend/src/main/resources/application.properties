spring.application.name=movie-discovery-agent
spring.profiles.active=${SPRING_PROFILES_ACTIVE:development}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Pre-stream chat timeout (NFR-1: model requests use a configurable timeout).
# Must comfortably exceed a real Gemini + Neon MCP tool round-trip
# (spring.ai.mcp.client.request-timeout=20s) plus model planning/generation latency.
app.chat.pre-stream-timeout-ms=45000
